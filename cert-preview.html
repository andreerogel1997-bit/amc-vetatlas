<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Vista previa del certificado · AMC VetAtlas</title>
  <link rel="icon" type="image/svg+xml" href="assets/amc-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    :root {
      --bg: #120c06;
      --panel: #1d160e;
      --border: rgba(199, 154, 62, 0.35);
      --text: #f4e9d0;
      --muted: rgba(236, 222, 190, 0.7);
      --gold: #e6c274;
      --gold-strong: #c79a3e;
    }
    [data-theme="light"] {
      --bg: #f3ead6;
      --panel: #fbf6ea;
      --border: rgba(154, 111, 40, 0.4);
      --text: #2a1d10;
      --muted: rgba(58, 40, 20, 0.75);
      --gold: #8a611f;
      --gold-strong: #9a6f28;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, 'Segoe UI', Roboto, Arial, sans-serif;
      padding: 1.25rem 1rem 3rem;
    }
    main { max-width: 1040px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 0.3rem; color: var(--gold); }
    p.nota { margin: 0 0 1.1rem; color: var(--muted); font-size: 0.9rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    .fila {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
    }
    .fila label { font-size: 0.85rem; font-weight: 600; }
    input[type="text"] {
      min-height: 44px;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      flex: 1 1 240px;
      max-width: 360px;
    }
    button {
      min-height: 44px;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font: 600 0.88rem Inter, sans-serif;
      cursor: pointer;
    }
    button.primario {
      background: linear-gradient(135deg, #e6c274, #c79a3e 55%, #9a6f28);
      color: #1d150c;
      border-color: transparent;
    }
    button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
    .cert-stage { position: relative; width: 100%; max-width: 1000px; margin: 0.5rem auto 0; }
    #certCanvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1600 / 1131;
      border-radius: 10px;
      background: #171009;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(199, 154, 62, 0.45);
    }
    [data-theme="light"] #certCanvas { background: #fbf6ea; box-shadow: 0 14px 40px rgba(110, 75, 20, 0.22), 0 0 0 1px rgba(154, 111, 40, 0.45); }
    #codigo { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 0.6rem; }
    @media (max-width: 600px) {
      .fila { flex-direction: column; align-items: stretch; }
      input[type="text"] { max-width: none; width: 100%; flex: none; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Vista previa del certificado</h1>
    <p class="nota">Prueba local del módulo <code>assets/vetatlas-certificate.js</code>. Los datos son de ejemplo.</p>

    <div class="panel">
      <div class="fila">
        <label for="certNameInput">Nombre para el certificado:</label>
        <input id="certNameInput" type="text" maxlength="80" value="Profesional Veterinario" placeholder="Ej. Dr. / Dra. Nombre Apellido" />
      </div>
      <div class="fila">
        <button id="temaOscuro" type="button" aria-pressed="true">Tema oscuro</button>
        <button id="temaClaro" type="button" aria-pressed="false">Tema claro</button>
        <button id="simAprobado" type="button">Simular aprobado (11/12)</button>
        <button id="simReprobado" type="button">Simular no aprobado (6/12)</button>
        <button id="cursoLargo" type="button">Curso largo (convulsiones)</button>
      </div>
      <div class="fila">
        <button id="downloadCertBtn" class="primario" type="button">Descargar certificado PNG</button>
      </div>
      <div class="cert-stage">
        <canvas id="certCanvas" width="1600" height="1131"></canvas>
      </div>
      <div id="codigo"></div>
    </div>
  </main>

  <script src="assets/vetatlas-certificate.js"></script>
  <script>
    (function () {
      // Cursos de ejemplo: los mismos textos que ya usan las páginas
      const CURSOS = {
        celulitis: {
          titulo: 'Certificado de Competencia Clínica',
          curso: 'Celulitis Flemonosa Bacteriana en Medicina Veterinaria',
          temas: 'Directrices ISCAID · Estándares CLSI VET-series · Diagnóstico POCUS y PAAF',
          insignia: '',
          archivo: 'Certificado_Celulitis_Flemonosa_AMC_VetAtlas.png'
        },
        convulsiones: {
          titulo: 'Certificado de Competencia en Epileptología',
          curso: 'Convulsiones y epilepsia en perros y gatos (Consensos IVETF / ACVIM)',
          temas: 'Fisiopatología PDS · Niveles IVETF I–III · Status Epilepticus · TDM Canino y Felino',
          insignia: 'INSIGNIA ORO · NEURÓLOGO DE GUARDIA',
          archivo: 'Certificado_Epilepsia_Canina_Felina_AMC_VetAtlas.png'
        }
      };
      const estado = { tema: 'dark', puntaje: 11, total: 12, curso: CURSOS.celulitis };
      const canvas = document.getElementById('certCanvas');
      const input = document.getElementById('certNameInput');
      let temporizador = null;

      function dibujar() {
        return window.VetAtlasCert.draw(canvas, {
          nombre: input.value,
          curso: estado.curso.curso,
          titulo: estado.curso.titulo,
          temas: estado.curso.temas,
          insignia: estado.curso.insignia,
          puntaje: estado.puntaje,
          total: estado.total,
          fecha: new Date(),
          tema: estado.tema
        }).then(function () {
          document.getElementById('codigo').textContent = 'Código de verificación: ' + (canvas.dataset.codigo || '');
        });
      }

      function simular(puntaje) {
        estado.puntaje = puntaje;
        dibujar().then(function () {
          window.VetAtlasCert.celebrate(canvas, { confeti: puntaje / estado.total >= window.VetAtlasCert.umbral });
        });
      }

      function ponerTema(tema) {
        estado.tema = tema;
        document.documentElement.setAttribute('data-theme', tema);
        document.getElementById('temaOscuro').setAttribute('aria-pressed', String(tema === 'dark'));
        document.getElementById('temaClaro').setAttribute('aria-pressed', String(tema === 'light'));
        dibujar();
      }

      input.addEventListener('input', function () {
        clearTimeout(temporizador);
        temporizador = setTimeout(dibujar, 200);
      });
      document.getElementById('temaOscuro').addEventListener('click', function () { ponerTema('dark'); });
      document.getElementById('temaClaro').addEventListener('click', function () { ponerTema('light'); });
      document.getElementById('simAprobado').addEventListener('click', function () { simular(11); });
      document.getElementById('simReprobado').addEventListener('click', function () { simular(6); });
      document.getElementById('cursoLargo').addEventListener('click', function (e) {
        const largo = estado.curso === CURSOS.celulitis;
        estado.curso = largo ? CURSOS.convulsiones : CURSOS.celulitis;
        e.currentTarget.textContent = largo ? 'Curso corto (celulitis)' : 'Curso largo (convulsiones)';
        dibujar();
      });
      document.getElementById('downloadCertBtn').addEventListener('click', function () {
        clearTimeout(temporizador);
        dibujar().then(function () {
          window.VetAtlasCert.download(canvas, estado.curso.archivo);
        });
      });

      simular(11);
    })();
  </script>
</body>
</html>
